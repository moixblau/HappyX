# HappyX stack for Portainer (Stacks > Add stack). Uses the images published to GHCR by the
# HappyX.Api and HappyX.Bot workflows, so nothing is built on the server.
#
# Set these in the stack's "Environment variables" section (never commit them); the stack
# refuses to start if any is missing:
#   POSTGRES_PASSWORD   database password
#   API_KEY_HASHES      SHA-256 hash(es) of the API keys, comma separated
#   DISCORD_TOKEN       Discord bot token
#   BOT_API_KEY         the bot's API key (its hash must be in API_KEY_HASHES)
# Optional:
#   HAPPYX_TAG          image tag to deploy (default: latest; e.g. 1.0.0 or sha-abc1234)
#   API_PORT            host port for the API (default: 8083)

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: happyx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: happyx
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U happyx -d happyx"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/moixblau/happyx-api:${HAPPYX_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://happyx:${POSTGRES_PASSWORD}@db:5432/happyx?sslmode=disable
      API_KEY_HASHES: ${API_KEY_HASHES:?}
    ports:
      - "${API_PORT:-8083}:8080"
    depends_on:
      db:
        condition: service_healthy

  bot:
    image: ghcr.io/moixblau/happyx-bot:${HAPPYX_TAG:-latest}
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?}
      API_URL: http://api:8080
      API_KEY: ${BOT_API_KEY:?}
    depends_on:
      - api

volumes:
  db_data:
