# HappyX stack for Portainer (Stacks > Add stack). Uses the images published to GHCR by the
# HappyX.Api, HappyX.Bot and HappyX.Web workflows, so nothing is built on the server.
#
# Set these in the stack's "Environment variables" section (never commit them); the stack
# refuses to start if any is missing:
#   POSTGRES_PASSWORD   database password
#   API_KEY_HASHES      SHA-256 hash(es) of the API keys, comma separated
#   DISCORD_TOKEN       Discord bot token
#   BOT_API_KEY         the bot's API key (its hash must be in API_KEY_HASHES)
# For the web dashboard (it works without them, but nobody can log in):
#   WEB_URL             public URL of the dashboard, e.g. https://happyx.example.com (the bot
#                       also uses it to link members to the «Who's who?» game)
#   DISCORD_CLIENT_ID   Discord application > OAuth2 > Client ID
#   DISCORD_CLIENT_SECRET  Discord application > OAuth2 > Client Secret
#   SESSION_SECRET      signs login sessions; generate with `openssl rand -hex 32`
#   In Discord application > OAuth2 > Redirects, add <WEB_URL>/api/web/auth/callback.
# Optional:
#   HAPPYX_TAG          image tag to deploy (default: latest; e.g. 1.0.0 or sha-abc1234)
#   WEB_PORT            host port for the dashboard (default: 8084). Put your HTTPS reverse
#                       proxy in front of it; only the dashboard needs to be public.
#   API_PORT            host port for the API (default: 8083), bound to 127.0.0.1 only so it
#                       can be checked from the server itself. Nothing outside the stack needs
#                       it: the bot and the dashboard reach the API on the internal network, and
#                       publishing it would expose the bot's /v1 API behind just the API key.
#   BACKUP_DIR          host folder for the database backups (default: the db_backups volume).
#                       The backup container runs as uid 999: run `chown -R 999:999 <folder>`.
#
# Backups: every night the backup service dumps the database to /backups, keeping 7 daily,
# 4 weekly and 6 monthly copies. To restore one (this replaces the current data):
#   docker exec -i <db container> psql -U happyx -d happyx -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
#   gunzip -c <backup>.sql.gz | docker exec -i <db container> psql -U happyx -d happyx

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: happyx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: happyx
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/18, so the volume mounts one level up.
      - db_data_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U happyx -d happyx"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/moixblau/happyx-api:${HAPPYX_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://happyx:${POSTGRES_PASSWORD}@db:5432/happyx?sslmode=disable
      API_KEY_HASHES: ${API_KEY_HASHES:?}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      WEB_URL: ${WEB_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    ports:
      - "127.0.0.1:${API_PORT:-8083}:8080"
    depends_on:
      db:
        condition: service_healthy

  bot:
    image: ghcr.io/moixblau/happyx-bot:${HAPPYX_TAG:-latest}
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?}
      API_URL: http://api:8080
      API_KEY: ${BOT_API_KEY:?}
      WEB_URL: ${WEB_URL:-}
    depends_on:
      - api

  web:
    image: ghcr.io/moixblau/happyx-web:${HAPPYX_TAG:-latest}
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
    ports:
      - "${WEB_PORT:-8084}:8080"
    depends_on:
      - api

  backup:
    image: prodrigestivill/postgres-backup-local:18
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: happyx
      POSTGRES_USER: happyx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      TZ: Europe/Madrid
    volumes:
      - ${BACKUP_DIR:-db_backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data_pg18:
  db_backups:
