# HappyX stack: the images published to GHCR by the HappyX.Api, HappyX.Bot and HappyX.Web
# workflows, so nothing is built on the server. Works with `docker compose` or as a Portainer stack.
#
#   docker compose -f stack.yml --env-file .env up -d
#
# The variables (POSTGRES_PASSWORD, API_KEY_HASHES, DISCORD_TOKEN, BOT_API_KEY are required; the
# stack refuses to start without them) are described in the HappyX README:
# https://github.com/happyx-app/HappyX#environment-variables
# Backups and how to restore them: https://github.com/happyx-app/HappyX#backups

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: happyx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: happyx
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/18, so the volume mounts one level up.
      - db_data_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U happyx -d happyx"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/happyx-app/happyx-api:${HAPPYX_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://happyx:${POSTGRES_PASSWORD}@db:5432/happyx?sslmode=disable
      API_KEY_HASHES: ${API_KEY_HASHES:?}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      WEB_URL: ${WEB_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # The admin API (port 8081) is off until ADMIN_KEY_HASH is set; only the admin service uses it.
      ADMIN_KEY_HASH: ${ADMIN_KEY_HASH:-}
      ADMIN_ADDR: ":8081"
      BACKUP_DIR: /backups
    volumes:
      # Read only, so the admin dashboard can list the latest backups.
      - ${BACKUP_DIR:-db_backups}:/backups:ro
    # 127.0.0.1 only: the bot and the dashboard use the internal network, and publishing it would
    # expose the bot's /v1 API behind just the API key.
    ports:
      - "127.0.0.1:${API_PORT:-8083}:8080"
    depends_on:
      db:
        condition: service_healthy

  bot:
    image: ghcr.io/happyx-app/happyx-bot:${HAPPYX_TAG:-latest}
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?}
      API_URL: http://api:8080
      API_KEY: ${BOT_API_KEY:?}
      WEB_URL: ${WEB_URL:-}
    depends_on:
      - api

  web:
    image: ghcr.io/happyx-app/happyx-web:${HAPPYX_TAG:-latest}
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
    ports:
      - "${WEB_PORT:-8084}:8080"
    depends_on:
      - api

  # Owner-only dashboard with counts across all servers. Keep it on the local network: do not
  # route it through a tunnel or reverse proxy. Its nginx also refuses non-private addresses.
  admin:
    image: ghcr.io/happyx-app/happyx-admin:${HAPPYX_TAG:-latest}
    restart: unless-stopped
    environment:
      API_URL: http://api:8081
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    ports:
      - "${ADMIN_PORT:-8090}:8080"
    depends_on:
      - api

  backup:
    image: prodrigestivill/postgres-backup-local:18
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: happyx
      POSTGRES_USER: happyx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      TZ: ${TZ:-UTC}
    volumes:
      - ${BACKUP_DIR:-db_backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data_pg18:
  db_backups:
