# Copy .env.example to .env and fill in the values before running `docker compose up`.
# The web (HappyX.Web) will be added back once it is rewritten.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Only reachable from localhost; remove the port in production.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./HappyX.Api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      API_KEY_HASHES: ${API_KEY_HASHES}
    ports:
      - "8083:8080"
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: ./HappyX.Bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      API_URL: http://api:8080
      API_KEY: ${BOT_API_KEY}
    depends_on:
      - api

volumes:
  db_data:
