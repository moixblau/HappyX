# Copy .env.example to .env and fill in the values before running `docker compose up`.
# The dashboard is at http://localhost:8084.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data_pg18:/var/lib/postgresql
    # Only reachable from localhost; remove the port in production.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./HappyX.Api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      API_KEY_HASHES: ${API_KEY_HASHES}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      WEB_URL: ${WEB_URL:-http://localhost:8084}
      SESSION_SECRET: ${SESSION_SECRET:-}
    ports:
      - "127.0.0.1:8083:8080" # local only: the bot and web use the internal network
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: ./HappyX.Bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      API_URL: http://api:8080
      API_KEY: ${BOT_API_KEY}
      WEB_URL: ${WEB_URL:-http://localhost:8084}
    depends_on:
      - api

  web:
    build: ./HappyX.Web
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
    ports:
      - "8084:8080"
    depends_on:
      - api

volumes:
  db_data_pg18:
